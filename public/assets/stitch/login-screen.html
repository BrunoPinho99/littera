<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Acessar sua conta - Redação Nota 1000</title>
  <!-- Tailwind CSS v3 CDN with forms and container queries plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff4ff',
              100: '#dbe7fe',
              500: '#3b66f5',
              600: '#4343ea',
              700: '#3534d4',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- BEGIN: Custom Styles -->
  <style data-purpose="custom-shadows-and-card">
    /* Subtle background and card shadows matching the reference clean aesthetic */
    .auth-card-shadow {
      box-shadow: 0 25px 60px -15px rgba(50, 65, 110, 0.12), 0 10px 25px -10px rgba(50, 65, 110, 0.08);
    }
    .pill-shadow {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
  </style>
  <!-- END: Custom Styles -->
</head>
<body class="bg-[#f6f8fb] min-h-screen flex items-center justify-center p-4 md:p-8 font-sans antialiased text-slate-800">
  <!-- BEGIN: AuthCard -->
  <main class="w-full max-w-[990px] bg-white rounded-[32px] p-4 auth-card-shadow flex flex-col md:flex-row items-stretch" data-purpose="auth-container">
    <!-- BEGIN: LeftBanner -->
    <!-- Gradient banner column with brand identity and quote -->
    <div class="w-full md:w-[46%] rounded-[24px] bg-gradient-to-b from-[#2b6af7] via-[#2a5ee8] to-[#2546cf] p-8 md:p-11 flex flex-col justify-between relative overflow-hidden shrink-0 min-h-[460px] md:min-h-[580px]">
      <!-- Brand Logo / Geometric Emblem -->
      <div class="relative z-10 flex items-center">
      </div>
      <!-- Bottom Headline and Kicker -->
      <div class="relative z-10 mt-auto pt-12">
        <p class="text-[12px] font-semibold tracking-wider text-blue-100 uppercase mb-3">
          REDAÇÃO NOTA 1000
        </p>
        <h1 class="text-2xl md:text-[27px] font-bold text-white leading-tight tracking-tight">
          A nota 1000 no ENEM começa na inteligência de cada correção.
        </h1>
      </div>
      <!-- Subtle ambient gradient overlay for deep contrast -->
      <div class="absolute -right-20 -bottom-20 w-80 h-80 rounded-full bg-blue-600/30 blur-3xl pointer-events-none"></div>
    </div>
    <!-- END: LeftBanner -->

    <!-- BEGIN: RightFormArea -->
    <!-- Form column containing role segment control, inputs, and actions -->
    <div class="w-full md:w-[54%] py-8 px-6 md:py-10 md:px-14 flex flex-col justify-center">
      <!-- Role Navigation Selector / Segmented Tabs -->
      <div class="mb-8" data-purpose="role-selector">
        <div class="inline-flex bg-[#f1f4f9] p-1.5 rounded-2xl w-full max-w-sm justify-between">
          <!-- Aluno Option (Active Tab) -->
          <button aria-selected="true" class="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-white pill-shadow text-brand-600 text-[13px] font-semibold transition" data-role="aluno" type="button">
            <!-- Student/Graduation Cap Icon -->
            <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
            <span>Aluno</span>
          </button>
          <!-- Professor Option -->
          <button aria-selected="false" class="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-xl text-slate-500 hover:text-slate-700 text-[13px] font-medium transition" data-role="professor" type="button">
            <!-- Professor/User Badge Icon -->
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <rect height="18" rx="2" width="18" x="3" y="3"></rect>
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M7 21v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Professor</span>
          </button>
          <!-- Escola Option -->
          <button aria-selected="false" class="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-xl text-slate-500 hover:text-slate-700 text-[13px] font-medium transition" data-role="escola" type="button">
            <!-- School/Building Icon -->
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <path d="M4 22h16"></path>
              <path d="M4 10V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v18"></path>
              <path d="M9 10h1"></path>
              <path d="M14 10h1"></path>
              <path d="M9 14h1"></path>
              <path d="M14 14h1"></path>
              <path d="M9 18h1"></path>
              <path d="M14 18h1"></path>
            </svg>
            <span>Escola</span>
          </button>
        </div>
      </div>

      <!-- Section Title & Subtitle -->
      <div class="mb-7" data-purpose="form-header">
        <h2 class="text-2xl md:text-[28px] font-bold text-slate-900 tracking-tight leading-snug">
          Acessar sua conta
        </h2>
        <p class="text-[13px] md:text-[13.5px] text-slate-500 mt-2 leading-relaxed">
          Acesse suas leituras, anotações e atividades a qualquer momento e continue de onde parou.
        </p>
      </div>

      <!-- Authentication Form -->
      <form action="#" class="space-y-4" data-purpose="login-form" method="POST">
        <!-- Email Input Group -->
        <div class="space-y-1.5">
          <label class="block text-[13px] font-medium text-slate-700" for="email">
            Seu e-mail
          </label>
          <input class="w-full h-11 px-4 text-[14px] text-slate-800 placeholder-slate-400 bg-white border border-slate-200 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all outline-none" id="email" name="email" placeholder="seu.email@exemplo.com.br" required="" type="email">
        </div>

        <!-- Password Input Group -->
        <div class="space-y-1.5 pt-1">
          <div class="flex items-center justify-between">
            <label class="block text-[13px] font-medium text-slate-700" for="password">
              Senha
            </label>
            <a class="text-[12.5px] font-medium text-brand-600 hover:text-brand-700 transition-colors" href="#">
              Esqueceu sua senha?
            </a>
          </div>
          <div class="relative flex items-center">
            <input class="w-full h-11 pl-4 pr-11 text-[14px] tracking-wider text-slate-800 placeholder-slate-400 bg-white border border-slate-200 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all outline-none" id="password" name="password" placeholder="••••••••••••" required="" type="password">
            <!-- Toggle Password Visibility Icon -->
            <button aria-label="Alternar visualização da senha" class="absolute right-3.5 text-slate-400 hover:text-slate-600 focus:outline-none transition p-0.5" type="button">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-3">
          <button class="w-full h-12 bg-[#4842e4] hover:bg-[#3d37d6] active:bg-[#342ecc] text-white text-[15px] font-medium rounded-xl shadow-lg shadow-indigo-500/25 transition-all transform active:scale-[0.99] flex items-center justify-center" type="submit">
            Entrar
          </button>
        </div>

        <!-- Bottom Sign Up Link -->
        <p class="text-center text-[13px] text-slate-500 pt-3">
          Não tem uma conta? 
          <a class="font-semibold text-brand-600 hover:text-brand-700 transition-colors" href="#">
            Cadastre-se gratuitamente
          </a>
        </p>
      </form>
    </div>
    <!-- END: RightFormArea -->
  </main>
  <!-- END: AuthCard -->
</body>
</html>
