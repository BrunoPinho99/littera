name: Agente SDR Diário - Littera

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 em Brasília
  workflow_dispatch:

jobs:
  run-sdr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install --no-audit --no-fund @supabase/supabase-js tsx

      - name: Executar Agente SDR
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SDR_REPORT_EMAIL: ${{ secrets.SDR_REPORT_EMAIL }}
        run: npx tsx scripts/sdr-agent.ts

      - name: Publicar lista do dia (CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdr-report-${{ github.run_number }}
          path: sdr-report.csv
          if-no-files-found: ignore
