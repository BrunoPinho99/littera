<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#faf8ff" />
    <title>Littera — A plataforma de redação que aprova no ENEM</title>
    <meta name="description" content="Correção de redação com IA nas 5 competências do ENEM. Feedback imediato, evolução contínua e ranking." />
    
    <!-- SEO: Canonical URL (sempre aponta para a landing page) -->
    <link rel="canonical" href="https://littera.app.br/" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://littera.app.br/" />
    <meta property="og:title" content="Littera — A plataforma de redação que aprova no ENEM" />
    <meta property="og:description" content="Correção de redação com IA nas 5 competências do ENEM. Feedback imediato, evolução contínua e ranking." />
    <meta property="og:site_name" content="Littera" />
    
    <!-- Bloqueia indexação de rotas internas -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.startsWith('/app') || path.startsWith('/cadastro') || path.startsWith('/login') || path.startsWith('/setup-account') || path.startsWith('/convite')) {
          var meta = document.createElement('meta');
          meta.name = 'robots';
          meta.content = 'noindex, nofollow';
          document.head.appendChild(meta);
        }
      })();
    </script>
    <!-- Tailwind and styles moved to index.css / local configuration -->
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
